version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    ports:
      - '9000:80'
    depends_on:
      - backend
    environment:
      - API_URL='https://84.39.245.249/:3000'
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - app-network
    # Добавляем healthcheck для надежности
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
