version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    ports:
      - '3001:80'
    depends_on:
      - backend
    environment:
      - API_URL='localhost:3000'
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
